<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#4A90D9">
  <meta name="format-detection" content="telephone=no">
  <title>背单词</title>
  <!-- v1.11.1 性能优化: 预连接 Supabase 域名, 节省 DNS+TCP+TLS 握手 ~200ms -->
  <link rel="preconnect" href="https://gjtjivmxxelnousbqmok.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://gjtjivmxxelnousbqmok.supabase.co">
  <!-- v1.11.1 性能优化: CSS 由 main.js import, Vite 自动注入 (开发 HMR + 构建提取到 dist/assets/) -->
</head>
<body>
  <!-- 授权登录层 (覆盖整个页面) -->
  <div id="authOverlay" class="auth-overlay hidden"></div>

  <div id="app">
    <!-- 顶部栏 -->
    <header class="app-header">
      <h1 class="app-title">背单词</h1>
      <div class="header-right">
        <span id="syncCodeBadge" class="sync-code-badge">用户名: default</span>
      </div>
    </header>

    <!-- 导航 -->
    <nav class="app-nav">
      <button class="nav-btn active" data-tab="learning">学习</button>
      <button class="nav-btn" data-tab="library">词库</button>
      <button class="nav-btn" data-tab="stats">统计</button>
      <button class="nav-btn" data-tab="profile">我的</button>
    </nav>

    <!-- 主内容 (v1.11.1: 各 view 内容由对应功能模块按需注入, 首屏只加载框架) -->
    <main class="app-main">
      <section id="view-learning" class="view active"></section>
      <section id="view-library" class="view"></section>
      <section id="view-stats" class="view"><div id="statsContent" class="stats-content"></div></section>
      <section id="view-profile" class="view"><div class="profile-content"></div></section>
    </main>
  </div>

  <!-- 弹窗 -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">标题</h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- 提示 -->
  <div id="toast" class="toast hidden"></div>

  <!-- v1.11.1: Vite 入口模块, 第三方库 (Chart.js/XLSX/Tesseract) 由各功能模块按需动态加载 -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
