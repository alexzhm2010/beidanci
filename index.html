<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#4A90D9">
  <meta name="format-detection" content="telephone=no">
  <title>背单词</title>
  <link rel="stylesheet" href="css/style.css?v=1.7.2">
</head>
<body>
  <!-- 授权登录层 (覆盖整个页面) -->
  <div id="authOverlay" class="auth-overlay hidden"></div>

  <div id="app">
    <!-- 顶部栏 -->
    <header class="app-header">
      <h1 class="app-title">背单词</h1>
      <div class="header-right">
        <span id="syncCodeBadge" class="sync-code-badge">用户名: default</span>
      </div>
    </header>

    <!-- 导航 -->
    <nav class="app-nav">
      <button class="nav-btn active" data-tab="learning">学习</button>
      <button class="nav-btn" data-tab="library">词库</button>
      <button class="nav-btn" data-tab="stats">统计</button>
      <button class="nav-btn" data-tab="profile">我的</button>
    </nav>

    <!-- 主内容 -->
    <main class="app-main">
      <!-- 学习模块 -->
      <section id="view-learning" class="view active">
        <div class="settings-panel">
          <div class="setting-group">
            <label class="setting-label">学习模式</label>
            <div class="btn-group" id="modeGroup">
              <button class="btn-toggle active" data-mode="en2cn">英译中</button>
              <button class="btn-toggle" data-mode="cn2en">中译英</button>
            </div>
          </div>
          <div class="setting-group">
            <label class="setting-label">新词数量</label>
            <div class="btn-group" id="newCountGroup">
              <button class="btn-toggle active" data-count="20">20</button>
              <button class="btn-toggle" data-count="40">40</button>
              <button class="btn-toggle" data-count="60">60</button>
            </div>
          </div>
          <div class="setting-group">
            <label class="setting-label">复习数量</label>
            <div class="btn-group" id="reviewCountGroup">
              <button class="btn-toggle active" data-count="30">30</button>
              <button class="btn-toggle" data-count="60">60</button>
              <button class="btn-toggle" data-count="90">90</button>
            </div>
          </div>
        </div>

        <div class="action-buttons">
          <button class="btn btn-primary btn-large" id="btnNewWords">新词学习</button>
          <button class="btn btn-secondary btn-large" id="btnReview">智能复习</button>
        </div>

        <div class="proficiency-section">
          <label class="setting-label">按熟练度复习</label>
          <div class="btn-group proficiency-group" id="proficiencyGroup">
            <button class="btn-toggle" data-range="0-40">&lt;40%</button>
            <button class="btn-toggle" data-range="40-60">40~60%</button>
            <button class="btn-toggle" data-range="60-80">60~80%</button>
            <button class="btn-toggle" data-range="80-100">80~100%</button>
          </div>
        </div>

        <div id="learningCard" class="learning-card hidden"></div>
      </section>

      <!-- 词库模块 -->
      <section id="view-library" class="view">
        <div class="library-toolbar">
          <input type="text" id="searchInput" class="search-input" placeholder="搜索单词或中文释义...">
          <div class="toolbar-buttons">
            <button class="btn btn-outline" id="btnImport">批量导入</button>
            <button class="btn btn-outline" id="btnAddWord" style="display:none;">单个新增</button>
            <button class="btn btn-outline" id="btnScanWord">扫词加词</button>
            <button class="btn btn-outline" id="btnExport">导出备份</button>
          </div>
        </div>
        <div class="library-info">
          <span id="libraryWordCount">共 0 词</span>
          <span id="librarySearchInfo"></span>
        </div>
        <div class="word-table-container" id="wordTableContainer">
          <table class="word-table">
            <thead>
              <tr>
                <th>单词/词组</th>
                <th>音标</th>
                <th>中文释义</th>
                <th>熟练度</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="wordTableBody"></tbody>
          </table>
        </div>
      </section>

      <!-- 统计模块 -->
      <section id="view-stats" class="view">
        <div id="statsContent" class="stats-content"></div>
      </section>

      <!-- 我的模块 -->
      <section id="view-profile" class="view">
        <div class="profile-content"></div>
      </section>
    </main>
  </div>

  <!-- 弹窗 -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">标题</h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- 提示 -->
  <div id="toast" class="toast hidden"></div>

  <!-- 第三方库 (jsDelivr 国内可靠, BootCDN 备用) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script>
    // Chart.js 回退加载 (jsDelivr 失败时尝试 BootCDN)
    if (typeof Chart === 'undefined') {
      document.write('<script src="https://cdn.bootcdn.net/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"><\/script>');
    }
    if (typeof XLSX === 'undefined') {
      document.write('<script src="https://cdn.bootcdn.net/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>');
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>

  <!-- 应用脚本 -->
  <script src="js/config.js?v=1.7.2"></script>
  <script src="js/db.js?v=1.7.2"></script>
  <script src="js/algorithm.js?v=1.7.2"></script>
  <script src="js/dictionary.js?v=1.7.2"></script>
  <script src="js/learning.js?v=1.7.2"></script>
  <script src="js/library.js?v=1.7.2"></script>
  <script src="js/stats.js?v=1.7.2"></script>
  <script src="js/auth.js?v=1.7.2"></script>
  <script src="js/admin.js?v=1.7.2"></script>
  <script src="js/app.js?v=1.7.2"></script>
</body>
</html>
