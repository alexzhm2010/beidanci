<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#4A90D9">
  <meta name="format-detection" content="telephone=no">
  <title>背单词</title>
  <!-- v1.27.0 首屏关键CSS(critical CSS): 外部样式由 main.js import, 构建时才注入 <link>,
       移动端首次打开/缓存未命中时, HTML 解析到 CSS 到位之间会短暂"无样式"渲染(FOUC):
       <h1>按浏览器默认 2em 放大→页眉膨胀错位→CSS 到位后跳变, 表现为"页眉只显示一半, 拖动后恢复"。
       这里内联首屏骨架的最小样式, 让 HTML 一解析就正确渲染, 彻底消除闪烁。值与 css/style.css 保持一致。 -->
  <style>
    html,body{margin:0;padding:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;font-size:15px;color:#333;background:#F0F2F5;-webkit-text-size-adjust:100%}
    *{box-sizing:border-box}
    #app{max-width:1200px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
    .app-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:#4A90D9;color:#fff;position:sticky;top:0;z-index:110}
    .app-title{font-size:22px;font-weight:700;margin:0;line-height:1.35}
    .header-right{display:flex;align-items:center;gap:10px}
    .sync-code-badge{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:20px;font-size:13px}
    .app-nav{display:flex;background:#fff;border-bottom:1px solid #E0E0E0;position:sticky;top:var(--header-h,57px);z-index:100}
    .nav-btn{flex:1;padding:14px;font-size:16px;font-weight:500;background:transparent;color:#666;border-bottom:3px solid transparent;text-align:center}
    .nav-btn.active{color:#4A90D9;border-bottom-color:#4A90D9;font-weight:600}
    .app-main{flex:1;padding:20px}
    .view{display:none}
    .view.active{display:block}
    .auth-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:10000;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:20px}
    .hidden{display:none!important}
    @media (max-width:768px){
      .app-header{padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
      .app-title{font-size:18px}
      .app-nav{position:fixed;top:auto;bottom:0;left:0;right:0;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #E0E0E0;border-bottom:none;box-shadow:0 -2px 10px rgba(0,0,0,.05)}
      .nav-btn{padding:14px 8px;font-size:14px;border-bottom:none;border-top:3px solid transparent;min-height:44px}
      .nav-btn.active{border-bottom:none;border-top-color:#4A90D9}
      .app-main{padding:12px 12px calc(56px + env(safe-area-inset-bottom) + 16px)}
    }
  </style>
  <!-- v1.11.1 性能优化: 预连接 Supabase 域名, 节省 DNS+TCP+TLS 握手 ~200ms -->
  <link rel="preconnect" href="https://gjtjivmxxelnousbqmok.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://gjtjivmxxelnousbqmok.supabase.co">
  <!-- v1.11.1 性能优化: CSS 由 main.js import, Vite 自动注入 (开发 HMR + 构建提取到 dist/assets/) -->
</head>
<body>
  <!-- 授权登录层 (覆盖整个页面) -->
  <div id="authOverlay" class="auth-overlay hidden"></div>

  <div id="app">
    <!-- 顶部栏 -->
    <header class="app-header">
      <h1 class="app-title">背单词</h1>
      <div class="header-right">
        <span id="syncCodeBadge" class="sync-code-badge">用户名: default</span>
      </div>
    </header>

    <!-- 导航 -->
    <nav class="app-nav">
      <button class="nav-btn active" data-tab="learning">学习</button>
      <button class="nav-btn" data-tab="library">词库</button>
      <button class="nav-btn" data-tab="stats">统计</button>
      <button class="nav-btn" data-tab="victor" style="display:none;">Victor词库</button>
      <button class="nav-btn" data-tab="profile">我的</button>
    </nav>

    <!-- 主内容 (v1.11.1: 各 view 内容由对应功能模块按需注入, 首屏只加载框架) -->
    <main class="app-main">
      <section id="view-learning" class="view active"></section>
      <section id="view-library" class="view"></section>
      <section id="view-stats" class="view"><div id="statsContent" class="stats-content"></div></section>
      <section id="view-victor" class="view view-frame"><iframe class="bookscan-frame" title="Victor词库"></iframe></section>
      <section id="view-profile" class="view"><div class="profile-content"></div></section>
    </main>
  </div>

  <!-- 弹窗 -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">标题</h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- 提示 -->
  <div id="toast" class="toast hidden"></div>

  <!-- v1.11.1: Vite 入口模块, 第三方库 (Chart.js/XLSX/Tesseract) 由各功能模块按需动态加载 -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
