name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          path: current_branch
          fetch-depth: 0

      - name: Determine deploy target
        id: target
        run: |
          cd current_branch
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "Current branch: $BRANCH"
          if [ "$BRANCH" = "main" ]; then
            echo "target=root" >> $GITHUB_OUTPUT
          else
            echo "target=beta" >> $GITHUB_OUTPUT
          fi

      - name: Checkout main branch
        if: steps.target.outputs.target == 'beta'
        uses: actions/checkout@v4
        with:
          ref: main
          path: main_branch

      - name: Checkout gh-pages branch (preserve existing beta if any)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: ghpages_branch
          fetch-depth: 0

      - name: Assemble publish directory
        run: |
          mkdir -p _publish
          TARGET=${{ steps.target.outputs.target }}
          shopt -s nullglob

          copy_site() {
            local src="$1"
            local dst="$2"
            mkdir -p "$dst"
            [ -f "$src/index.html" ] && cp "$src/index.html" "$dst/"
            [ -d "$src/css" ] && cp -r "$src/css" "$dst/"
            [ -d "$src/js" ] && cp -r "$src/js" "$dst/"
            [ -d "$src/sql" ] && cp -r "$src/sql" "$dst/"
            [ -d "$src/tessdata" ] && cp -r "$src/tessdata" "$dst/"
            for f in "$src"/*.jpg "$src"/*.png "$src"/*.svg "$src"/*.ico "$src"/*.webp; do
              cp "$f" "$dst/"
            done
          }

          if [ "$TARGET" = "root" ]; then
            copy_site current_branch _publish
            if [ -d "ghpages_branch/beta" ]; then
              echo "Preserve existing /beta/"
              cp -r ghpages_branch/beta _publish/beta
            fi
          else
            copy_site main_branch _publish
            copy_site current_branch _publish/beta
            echo "beta deployed at $(date -u +%Y-%m-%dT%H:%M:%SZ) from branch ${{ github.ref_name }}" > _publish/beta/version.txt
          fi

          echo "Publish directory:"
          find _publish -maxdepth 3 -type f | head -80

      - name: Push to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _publish
          publish_branch: gh-pages
          force_orphan: false
          keep_files: false
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "deploy: ${{ github.ref_name }} at ${{ github.sha }}"

      - name: Summary
        run: |
          echo "## 部署完成" >> $GITHUB_STEP_SUMMARY
          echo "- 主线 (main):  https://alexzhm2010.github.io/beidanci/" >> $GITHUB_STEP_SUMMARY
          echo "- 测试 (beta):  https://alexzhm2010.github.io/beidanci/beta/" >> $GITHUB_STEP_SUMMARY
          echo "- 触发分支: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- 提交: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
